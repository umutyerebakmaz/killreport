query Regions($filter: RegionFilter) {
  regions(filter: $filter) {
    items {
      id
      name
      description
      constellationCount
      solarSystemCount
    }
    pageInfo {
      currentPage
      totalPages
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}

query Region($id: Int!) {
  region(id: $id) {
    id
    name
    description
    constellationCount
    sovereignty {
      ownerType
      ownerId
      ownerName
      allianceTicker
      systemCount
    }
    constellations {
      id
      name
      solarSystemCount
      sovereignty {
        ownerType
        ownerId
        ownerName
        allianceTicker
        systemCount
      }
    }
  }
}
