mutation Login($returnTo: String) {
  login(returnTo: $returnTo) {
    url
    state
  }
}

mutation RefreshSession {
  refreshSession {
    accessToken
    expiresIn
    user {
      id
      name
      email
      createdAt
    }
  }
}

mutation Logout {
  logout
}

query MySessions {
  mySessions {
    id
    createdAt
    lastSeenAt
    expiresAt
    userAgent
    ip
    current
  }
}

mutation RevokeSession($id: ID!) {
  revokeSession(id: $id)
}
