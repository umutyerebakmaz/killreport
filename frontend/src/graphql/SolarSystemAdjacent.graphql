query SolarSystemAdjacent($id: Int!) {
  solarSystem(id: $id) {
    id
    stargates {
      id
      name
      destination {
        destinationSystemId
        system {
          id
          name
          securityStatus
          constellation {
            id
            name
            region {
              id
              name
            }
          }
          latestActivity {
            ship_kills
            pod_kills
            npc_kills
          }
        }
      }
    }
  }
}
