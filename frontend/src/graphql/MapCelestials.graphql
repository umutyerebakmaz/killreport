# The operation must be named MapCelestials: the backend's response cache
# looks it up in PUBLIC_CACHE_QUERIES by operation name (backend/src/config/cache.ts).
query MapCelestials($systemIds: [Int!]!) {
  mapCelestials(systemIds: $systemIds) {
    id
    systemId
    name
    kind
    x
    z
    orbitIndex
    planetId
    destinationSystemId
  }
}
