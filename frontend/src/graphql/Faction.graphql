query Faction($id: Int!) {
  faction(id: $id) {
    id
    name
    description
    stationCount
    stationSystemCount
    memberCorporationCount
    memberCharacterCount
    sovereigntySystemCount
    solarSystem {
      id
      name
    }
    corporation {
      id
      name
    }
    militiaCorporation {
      id
      name
    }
  }
}

query Factions {
  factions {
    id
    name
    memberCorporationCount
    memberCharacterCount
    sovereigntySystemCount
  }
}

query FactionKillmails($filter: KillmailFilter) {
  killmails(filter: $filter) {
    items {
      id
      killmailTime
      totalValue
      attackerCount
      solo
      npc
      isWarRelated
      victim {
        character {
          id
          name
        }
        corporation {
          id
          name
        }
        alliance {
          id
          name
        }
        shipType {
          id
          name
          group {
            name
          }
          dogmaAttributes(ids: [422, 1692]) {
            attribute_id
            value
          }
        }
        damageTaken
      }
      finalBlow {
        character {
          id
          name
        }
        corporation {
          id
          name
        }
        alliance {
          id
          name
        }
      }
      attackers {
        character {
          id
          name
        }
        corporation {
          id
          name
        }
        alliance {
          id
          name
        }
      }
      solarSystem {
        id
        name
        securityStatus
        constellation {
          id
          name
          region {
            id
            name
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      currentPage
      totalPages
      totalCount
    }
  }
}

query FactionCorporations($filter: CorporationFilter) {
  corporations(filter: $filter) {
    items {
      id
      name
      ticker
      member_count
      ceo {
        id
        name
      }
    }
    pageInfo {
      currentPage
      totalPages
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}
