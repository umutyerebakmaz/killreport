# The operation must be named MapSystemDetails: the backend's response cache
# looks it up in PUBLIC_CACHE_QUERIES by operation name (backend/src/config/cache.ts).
# Renaming it drops the cache to 120 s per token.
query MapSystemDetails($systemId: Int!) {
  mapSystemDetails(systemId: $systemId) {
    systemId
    name
    securityStatus
    constellationName
    regionName
    owner {
      ownerId
      kind
      name
      ticker
    }
    stargates {
      stargateId
      destinationSystemId
      destinationName
      destinationSecurityStatus
    }
    shipKills
    podKills
    npcKills
    shipJumps
    snapshotAt
  }
}
