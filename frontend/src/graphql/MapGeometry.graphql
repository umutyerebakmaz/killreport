# The operation must be named MapGeometry: the backend's response cache
# looks it up in PUBLIC_CACHE_QUERIES by operation name (backend/src/config/cache.ts).
# Renaming it silently drops the cache to 120 s per token.
query MapGeometry($scope: MapScope!) {
  mapGeometry(scope: $scope) {
    scope
    bounds {
      minX
      maxX
      minZ
      maxZ
    }
    nodes {
      systemId
      name
      x
      z
      radius
      securityStatus
      constellationId
      regionId
    }
    edges {
      from
      to
    }
  }
}
