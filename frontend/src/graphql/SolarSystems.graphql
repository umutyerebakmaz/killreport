query SolarSystems($filter: SolarSystemFilter) {
  solarSystems(filter: $filter) {
    items {
      id
      name
      securityStatus
      constellation {
        id
        name
        region {
          id
          name
        }
      }
      latestKills {
        ship_kills
        pod_kills
        npc_kills
        timestamp
      }
    }
    pageInfo {
      currentPage
      totalPages
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}
