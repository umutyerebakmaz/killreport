# The name is **not** in PUBLIC_CACHE_QUERIES, on purpose: the service's own 900 s
# Redis key already does the job, and the response cache as a second layer
# would only double the staleness. If it is ever added to that list, its TTL
# must go into TTL_PER_SCHEMA_COORDINATE too — otherwise it falls back to the
# 120 s DEFAULT_PUBLIC and a per-token session key.
query MapSovereignty($scope: MapScope!) {
  mapSovereignty(scope: $scope) {
    scope
    updatedAt
    owners {
      ownerId
      kind
      name
      ticker
      systemCount
    }
    systems {
      systemId
      ownerId
    }
  }
}
