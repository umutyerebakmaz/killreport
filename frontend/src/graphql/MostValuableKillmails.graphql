query MostValuableKillmails(
  $scope: MostValuableScope!
  $days: Int
  $limit: Int
  $regionId: Int
) {
  mostValuableKillmails(
    scope: $scope
    days: $days
    limit: $limit
    regionId: $regionId
  ) {
    id
    killmailTime
    totalValue
    victim {
      character {
        id
        name
      }
      corporation {
        id
        name
      }
      alliance {
        id
        name
      }
      shipType {
        id
        name
        dogmaAttributes(ids: [422, 1692]) {
          attribute_id
          value
        }
      }
    }
    solarSystem {
      id
      name
      securityStatus
      # Kept for the region hanging off it; the constellation's own name is
      # not shown on the card.
      constellation {
        id
        region {
          id
          name
        }
      }
    }
    finalBlow {
      character {
        id
        name
      }
      corporation {
        id
        name
      }
      alliance {
        id
        name
      }
    }
  }
}
