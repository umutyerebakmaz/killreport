query MostValuableKillmails(
  $scope: MostValuableScope!
  $days: Int
  $limit: Int
) {
  mostValuableKillmails(scope: $scope, days: $days, limit: $limit) {
    id
    killmailTime
    totalValue
    victim {
      character {
        id
        name
      }
      # Neither name is drawn as its own line any more. They stay because the
      # logo's alt text is the alliance's name when there is one and the
      # corporation's otherwise, and both arrive on rows the card already loads.
      corporation {
        id
        name
      }
      alliance {
        id
        name
      }
      shipType {
        id
        name
        dogmaAttributes(ids: [422, 1692]) {
          attribute_id
          value
        }
      }
    }
    solarSystem {
      id
      name
      securityStatus
      # The region hangs off the constellation, so the node has to stay even
      # though the constellation's own name is no longer shown.
      constellation {
        id
        region {
          id
          name
        }
      }
    }
  }
}
