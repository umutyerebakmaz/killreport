input KillmailFilter {
  page: Int
  limit: Int
  orderBy: KillmailOrderBy
  search: String
  shipTypeId: Int
  shipGroupIds: [Int!]
  """
  Only ships of this tier, from types.meta_group_id. Combined with shipTypeId
  or shipGroupIds it narrows them, and it follows the same victim / attacker
  choice.
  """
  shipTier: ShipTierFilter
  victim: Boolean
  attacker: Boolean
  characterId: Int
  characterVictim: Boolean
  characterAttacker: Boolean
  corporationId: Int
  allianceId: Int
  factionId: Int
  regionId: Int
  constellationId: Int
  systemId: Int
  securitySpace: String
  minAttackers: Int
  maxAttackers: Int
  minValue: Float
  maxValue: Float
  startDate: String
  endDate: String
  "Only return killmails correlated to an active sovereignty campaign."
  warRelated: Boolean
}

"""
A ship tier for the killmail filter, by the type's meta group: TECH2 is 2,
TECH3 is 14, FACTION is 3 and 4 (Storyline and Faction/Navy/Fleet), the
groups the ship tier badge draws.
"""
enum ShipTierFilter {
  TECH2
  TECH3
  FACTION
}
