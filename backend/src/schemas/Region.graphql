type Region {
  id: Int!
  name: String!
  description: String
  constellations: [Constellation!]!
  constellationCount: Int!
  solarSystemCount: Int!
  """
  Who holds the region, or null where nothing in it is held — 44 of the 114
  regions, wormhole space among them.
  """
  sovereignty: SovereigntyHolder
}

enum RegionOrderBy {
  nameAsc
  nameDesc
}

type RegionsResponse {
  items: [Region!]!
  pageInfo: PageInfo!
}

input RegionFilter {
  page: Int
  limit: Int
  search: String
  name: String
  orderBy: RegionOrderBy
}

input StartRegionSyncInput {
  clientMutationId: String
}

type StartRegionSyncPayload {
  success: Boolean!
  message: String
  clientMutationId: String
}

extend type Query {
  region(id: Int!): Region
  regions(filter: RegionFilter): RegionsResponse!
}

extend type Mutation {
  startRegionSync(input: StartRegionSyncInput!): StartRegionSyncPayload!
}
