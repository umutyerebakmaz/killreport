enum LeaderboardPeriod {
  TODAY
  WEEK
  MONTH
  LAST_7_DAYS
  LAST_90_DAYS
}

input TopFilter {
  """
  Defaults to LAST_7_DAYS.
  """
  period: LeaderboardPeriod
  """
  Anchors the period. YYYY-MM-DD for TODAY, any day of the target week for
  WEEK (rounded back to its Monday), YYYY-MM for MONTH. Ignored by the rolling
  windows LAST_7_DAYS and LAST_90_DAYS. Empty means today / this week / this month.
  """
  anchor: String
  """
  Max 100; default 100
  """
  limit: Int
  systemId: Int
  constellationId: Int
  regionId: Int
}

type TopPilot {
  rank: Int!
  killCount: Int!
  character: Character
}

type TopCorporation {
  rank: Int!
  killCount: Int!
  corporation: Corporation
}

type TopAlliance {
  rank: Int!
  killCount: Int!
  alliance: Alliance
}

type TopLast7DaysShip {
  rank: Int!
  killCount: Int!
  shipType: Type
}

input TopLast7DaysShipsFilter {
  """
  Max 100; default 100
  """
  limit: Int
  """
  Filter by region ID
  """
  regionId: Int
  """
  Filter by constellation ID
  """
  constellationId: Int
  """
  Filter by solar system ID
  """
  systemId: Int
}

type TopLast7DaysAttackerShip {
  rank: Int!
  killCount: Int!
  shipType: Type
}

input TopLast7DaysAttackerShipsFilter {
  """
  Max 100; default 100
  """
  limit: Int
}

extend type Query {
  """
  Top pilots by kill count over the window named by filter.period.
  """
  topPilots(filter: TopFilter): [TopPilot!]!

  """
  Top corporations by kill count over the window named by filter.period.
  """
  topCorporations(filter: TopFilter): [TopCorporation!]!

  """
  Top alliances by kill count over the window named by filter.period.
  """
  topAlliances(filter: TopFilter): [TopAlliance!]!

  """
  Returns top ship types ranked by total kill count over the last 7 days (rolling window, today - 6 days)
  """
  topLast7DaysShips(filter: TopLast7DaysShipsFilter): [TopLast7DaysShip!]!

  """
  Returns top attacker ship types by usage count over the last 7 days (rolling window, today - 6 days)
  """
  topLast7DaysAttackerShips(
    filter: TopLast7DaysAttackerShipsFilter
  ): [TopLast7DaysAttackerShip!]!
}
