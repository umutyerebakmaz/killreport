# Universe topology for the solar system detail page.
#
# `Position` is NOT redefined here — it already exists in Position.graphql and
# SolarSystem.position uses it.

"A stargate in the system. Mirrors ESI's stargates[] array, with its ends resolved."
type Stargate {
  id: Int!
  name: String
  typeId: Int
  type: Type
  destination: StargateDestination
  position: Position
  solarSystem: SolarSystem
}

"""
The destination object from ESI's stargate response.
The raw IDs are null until step 3 runs; the objects are also null when the
matching row is not in the database.
"""
type StargateDestination {
  destinationSystemId: Int
  destinationStargateId: Int
  "The system at the far end."
  system: SolarSystem
  "The stargate at the far end; its own destination points back to this system."
  stargate: Stargate
}

type Star {
  id: Int!
  name: String
  typeId: Int
  type: Type
  "E.g. \"M2 V\"."
  spectralClass: String
  "Kelvin."
  temperature: Int
  "Metres."
  radius: Float
  "Years."
  age: Float
  luminosity: Float
  solarSystem: SolarSystem
  # ESI's star response has no position — the star sits at the system centre.
}

type Planet {
  id: Int!
  name: String
  typeId: Int
  "Barren, Gas, Temperate, Storm…"
  type: Type
  "1-based position in ESI's planets[] array."
  orbitIndex: Int
  position: Position
  moons: [Moon!]!
  asteroidBelts: [AsteroidBelt!]!
  solarSystem: SolarSystem
}

type Moon {
  id: Int!
  name: String
  "1-based position in ESI's planets[].moons array."
  orbitIndex: Int
  position: Position
  planet: Planet
  solarSystem: SolarSystem
}

type AsteroidBelt {
  id: Int!
  name: String
  orbitIndex: Int
  position: Position
  planet: Planet
  solarSystem: SolarSystem
}

type Station {
  id: Int!
  name: String
  typeId: Int
  type: Type
  ownerCorporationId: Int
  ownerCorporation: Corporation
  raceId: Int
  services: [String!]!
  reprocessingEfficiency: Float
  "The station's cut of reprocessing; 0.05 = 5%."
  reprocessingStationsTake: Float
  "Office rental cost in ISK."
  officeRentalCost: Float
  maxDockableShipVolume: Float
  position: Position
  solarSystem: SolarSystem
}

type SolarSystemCounts {
  stargates: Int!
  planets: Int!
  moons: Int!
  asteroidBelts: Int!
  stations: Int!
  sovereigntyStructures: Int!
}

type SolarSystemStats {
  systemId: Int!
  totalKills: Int!
  totalIskDestroyed: Float!
  kills24h: Int!
  kills7d: Int!
  iskDestroyed7d: Float!
  lastKillTime: String
  "The UTC hour with the most kills over the last 7 days (0-23)."
  busiestHourUtc: Int
}

extend type SolarSystem {
  stargates: [Stargate!]!
  planets: [Planet!]!
  stations: [Station!]!
  "Unnamed until step 3 runs; null when star_id is empty."
  star: Star
  counts: SolarSystemCounts!
}

extend type Query {
  solarSystemStats(systemId: Int!): SolarSystemStats!
}
