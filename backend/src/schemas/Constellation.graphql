type Constellation {
  id: Int!
  name: String!
  position: Position
  region: Region
  solarSystems: [SolarSystem!]!
  solarSystemCount: Int!
  """
  Who holds the constellation, or null where nothing in it is held —
  wormhole space and unclaimed nullsec, 400 of the 1184 constellations.
  """
  sovereignty: SovereigntyHolder
}

enum ConstellationOrderBy {
  nameAsc
  nameDesc
}

type ConstellationsResponse {
  items: [Constellation!]!
  pageInfo: PageInfo!
}

input ConstellationFilter {
  page: Int
  limit: Int
  search: String
  name: String
  region_id: Int
  orderBy: ConstellationOrderBy
}

input StartConstellationSyncInput {
  clientMutationId: String
}

type StartConstellationSyncPayload {
  success: Boolean!
  message: String
  clientMutationId: String
}

extend type Query {
  constellation(id: Int!): Constellation
  constellations(filter: ConstellationFilter): ConstellationsResponse!
}

extend type Mutation {
  startConstellationSync(
    input: StartConstellationSyncInput!
  ): StartConstellationSyncPayload!
}
