[workspace]
members = ["crates/*", "workers/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Every version lives here once; crates take them with `x.workspace = true`.
# TLS is rustls everywhere: no crate may pull in OpenSSL, so that the phase 2
# build can be a static x86_64-unknown-linux-musl binary
# (docs/superpowers/specs/2026-11-12-rust-worker-spike-design.md, "Derleme").
[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15"
futures-util = "0.3"
lapin = { version = "2", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

db = { path = "crates/db" }
esi = { path = "crates/esi" }
mq = { path = "crates/mq" }
runner = { path = "crates/runner" }
