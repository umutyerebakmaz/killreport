name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository, so the token only reads.
permissions:
  contents: read

env:
  NODE_VERSION: 22
  # backend's postinstall runs `prisma generate`, which loads prisma.config.ts and
  # needs this set. No database is contacted. It lives at workflow level so a job
  # added later cannot forget it, which is exactly how the Format job first failed.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/killreport

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      # The pre-commit hook formats staged files, but a hook can be skipped and a
      # fresh clone has none until yarn install runs. This is the backstop.
      - run: yarn format:check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn workspace backend typecheck
      - run: yarn workspace backend test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-files lint below needs the base commit to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable

      # Two lint passes, and the split is deliberate. The repository carries a
      # backlog of pre-existing ESLint errors, so linting everything cannot gate
      # a build without blocking unrelated work.
      #
      # This gate used to lint whole changed files, which held until a change was
      # broad rather than deep: a repository-wide restyling touches the files
      # carrying the most backlog and inherits every problem already in them,
      # none of which it caused. It now measures the lines the pull request adds,
      # which asks what the gate always meant to ask — did this make things worse
      # — instead of asking who last touched the file.
      - name: Lint lines added by this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/lint-added-lines.mjs "$BASE_SHA"

      - name: Lint the whole frontend (report only)
        run: yarn workspace frontend lint
        continue-on-error: true

      - run: yarn workspace frontend typecheck
      - run: yarn workspace frontend test
