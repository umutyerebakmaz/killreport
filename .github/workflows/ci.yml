name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository, so the token only reads.
permissions:
  contents: read

env:
  NODE_VERSION: 22
  # backend's postinstall runs `prisma generate`, which loads prisma.config.ts and
  # needs this set. No database is contacted. It lives at workflow level so a job
  # added later cannot forget it, which is exactly how the Format job first failed.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/killreport

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      # The pre-commit hook formats staged files, but a hook can be skipped and a
      # fresh clone has none until yarn install runs. This is the backstop.
      - run: yarn format:check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn workspace backend typecheck
      - run: yarn workspace backend test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-files lint below needs the base commit to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable

      # Two lint passes, and the split is deliberate. The repository carries a
      # backlog of pre-existing ESLint errors, so linting everything cannot gate
      # a build without blocking unrelated work. Linting only what the pull
      # request touched can, and does: the backlog shrinks or holds, never grows.
      - name: Lint changed frontend files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Filter with grep rather than a git pathspec: git globs match "/" with a
          # single "*", so a pathspec here would quietly widen the selection.
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD \
            | grep -E '^frontend/src/.*\.tsx?$' \
            | sed 's|^frontend/||' || true)
          if [ -z "$files" ]; then
            echo "No frontend source files changed."
            exit 0
          fi
          echo "$files"
          # NUL-delimited so a path with a space survives, and so the step behaves
          # the same under BSD xargs when rehearsed on a Mac.
          printf '%s\n' "$files" | tr '\n' '\0' \
            | xargs -0 yarn workspace frontend exec eslint

      - name: Lint the whole frontend (report only)
        run: yarn workspace frontend lint
        continue-on-error: true

      - run: yarn workspace frontend typecheck
      - run: yarn workspace frontend test
