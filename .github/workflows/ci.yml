name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository, so the token only reads.
permissions:
  contents: read

env:
  NODE_VERSION: 22
  # backend's postinstall runs `prisma generate`, which loads prisma.config.ts and
  # needs this set. No database is contacted. It lives at workflow level so a job
  # added later cannot forget it, which is exactly how the Format job first failed.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/killreport

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      # The pre-commit hook formats staged files, but a hook can be skipped and a
      # fresh clone has none until yarn install runs. This is the backstop.
      - run: yarn format:check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The shared ESI limiter's Lua scripts are tested against a real Redis;
    # those specs skip themselves when REDIS_URL is unset.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn workspace backend typecheck
      - run: yarn workspace backend test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-files lint below needs the base commit to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable

      # Two lint passes, and the split is deliberate. The repository carries a
      # backlog of pre-existing ESLint errors, so linting everything cannot gate
      # a build without blocking unrelated work.
      #
      # This gate used to lint whole changed files, which held until a change was
      # broad rather than deep: a repository-wide restyling touches the files
      # carrying the most backlog and inherits every problem already in them,
      # none of which it caused. It now measures the lines the pull request adds,
      # which asks what the gate always meant to ask — did this make things worse
      # — instead of asking who last touched the file.
      - name: Lint lines added by this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/lint-added-lines.mjs "$BASE_SHA"

      - name: Lint the whole frontend (report only)
        run: yarn workspace frontend lint
        continue-on-error: true

      - run: yarn workspace frontend typecheck
      - run: yarn workspace frontend test

  backend-rs:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-rs
    # The upsert tests (sqlx::test) create a throwaway database per test on
    # this server; the workflow-level DATABASE_URL already points here.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: killreport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The shared ESI limiter's Rust store is tested against a real Redis;
      # those tests skip themselves when REDIS_URL is unset.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      # Compile the checked queries from backend-rs/.sqlx instead of asking
      # the database, so a stale cache fails the build instead of passing.
      SQLX_OFFLINE: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # Installs the version pinned in backend-rs/rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Tests marked #[ignore] need RabbitMQ or real data and do not run here.
      - run: cargo test

  # Static x86_64 musl binaries of every queue and worker crate, the ones the
  # systemd units run (backend/docs/ops/systemd.md, "Moving a unit to Rust").
  # Pull requests build and check them; only a push to main keeps the artifact.
  backend-rs-linux:
    name: Backend (Rust, Linux binaries)
    needs: backend-rs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-rs
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      # Only here, not in rust-toolchain.toml, so a local Windows checkout
      # does not download a target it never builds.
      - run: rustup target add x86_64-unknown-linux-musl
      # ring compiles C and needs musl-gcc.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
          key: linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --bins
      - name: Collect and check the binaries
        run: |
          mkdir -p dist/bin
          for bin in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name'); do
            cp "target/x86_64-unknown-linux-musl/release/$bin" dist/bin/
          done
          crates=$(ls -d queues/*/ workers/*/ | wc -l)
          bins=$(ls dist/bin | wc -l)
          echo "$bins binaries for $crates crates"
          if [ "$bins" -ne "$crates" ]; then exit 1; fi
          file dist/bin/*
          if file dist/bin/* | grep -Ev 'statically linked|static-pie linked'; then
            echo "::error::a binary is not statically linked"
            exit 1
          fi
      - name: Package
        run: |
          (cd dist/bin && sha256sum * > ../SHA256SUMS)
          echo "$GITHUB_SHA" > dist/COMMIT
          tar czf killreport-rs-linux-x86_64.tar.gz -C dist bin SHA256SUMS COMMIT
          # Unpack it the way the server will, so a broken archive fails here.
          check=$(mktemp -d)
          tar xzf killreport-rs-linux-x86_64.tar.gz -C "$check"
          (cd "$check/bin" && sha256sum -c ../SHA256SUMS)
          for f in "$check"/bin/*; do test -x "$f"; done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: killreport-rs-linux-x86_64
          path: backend-rs/killreport-rs-linux-x86_64.tar.gz
          retention-days: 30
          if-no-files-found: error
